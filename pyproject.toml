[project]
name = "kelvin-rl-summative"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pybullet>=3.2.7",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "stable-baselines3[extra]>=2.9.0",
    "torch>=2.13.0",
    "tyro>=1.0.15",
    "uvicorn>=0.52.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
